name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver tag to create, for example v0.2.0"
        required: true
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Create tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the annotated tag through the GitHub API
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run this workflow from main. Ref is ${GITHUB_REF}." >&2
          exit 1

      - name: Validate version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - << 'PY'
          import os, re, sys
          version = os.environ.get("RELEASE_VERSION", "")
          pattern = re.compile(
              r"^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
              r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$"
          )
          if pattern.fullmatch(version) is None:
              sys.exit(
                  "version must look like v0.2.0 (optional prerelease and build metadata allowed)"
              )
          print(version)
          PY

      - name: Create tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          # gh reads this from the environment. It is not passed on a command line
          # and is not written into git config.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" --jq .ref >/dev/null 2>&1; then
            echo "tag ${RELEASE_VERSION} already exists" >&2
            exit 1
          fi
          tag_sha="$(jq -n \
            --arg tag "${RELEASE_VERSION}" \
            --arg message "Release ${RELEASE_VERSION}" \
            --arg object "${GITHUB_SHA}" \
            '{tag:$tag, message:$message, object:$object, type:"commit"}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" --input - --jq .sha)"
          jq -n \
            --arg ref "refs/tags/${RELEASE_VERSION}" \
            --arg sha "${tag_sha}" \
            '{ref:$ref, sha:$sha}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" --input - --jq .ref

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # publish the GitHub Release and its build artifacts
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
